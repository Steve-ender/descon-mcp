name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e .[dev,ocr,vision]
          .\.venv\Scripts\python.exe -m pip install -r requirements-release.txt

      - name: Build + Verify + SBOM + Security Gate
        shell: pwsh
        env:
          NOVAFORGE_STRICT_SECURITY_GATE: "1"
        run: |
          .\.venv\Scripts\python.exe scripts\release_gate.py

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/release/package_manifest_latest.json
            artifacts/release/sbom_latest.cyclonedx.json
            artifacts/security/security_gate_latest.json
