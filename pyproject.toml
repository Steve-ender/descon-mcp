[project]
name = "novaforge-mcp"
version = "0.1.0"
description = "NovaForge MCP: high-capability local Windows desktop automation server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "NovaForge Contributors"}
]
keywords = ["mcp", "desktop-automation", "windows", "ui-automation", "screen-control"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Desktop Environment",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.12.0",
  "pywinauto>=0.6.9",
  "pyautogui>=0.9.54",
  "mss>=10.1.0",
  "pillow>=11.0.0",
  "psutil>=6.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
  "comtypes>=1.3.0"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
vision = ["opencv-python>=4.10.0.84", "numpy>=2.0.0"]
dev = ["pytest>=8.3.0", "build>=1.4.0", "pip-audit>=2.9.0", "cyclonedx-bom>=7.2.1"]

[project.urls]
Homepage = "https://github.com/novaforge/novaforge-mcp"
Repository = "https://github.com/novaforge/novaforge-mcp"
Documentation = "https://github.com/novaforge/novaforge-mcp#readme"
Issues = "https://github.com/novaforge/novaforge-mcp/issues"

[project.scripts]
novaforge-mcp = "novaforge.server:main"
novaforge-admin = "novaforge.admin_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novaforge*"]

[tool.setuptools.package-data]
novaforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
